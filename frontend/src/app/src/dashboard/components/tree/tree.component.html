<section [class.collapsed]="collapsed">
  <div class="toggle-btn-wrapper">
    <button mat-icon-button (click)="toggle()" class="toggle-btn" [title]="collapsed ? 'Expandir panel' : 'Colapsar panel'">
      <mat-icon>{{ collapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <div class="tree-content">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
      <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
        <button mat-icon-button disabled>
          <mat-icon>remove</mat-icon>
        </button>
        <a
          class="sideOption"
          ngClass="active:node.folder_id==currentFolder"
          (click)="returnFolderId(node.folder_id)"
        >
          <mat-icon color="accent">folder</mat-icon>{{ node.name }}
        </a>
      </mat-tree-node>
      <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        matTreeNodePadding
      >
        <button
          mat-icon-button
          matTreeNodeToggle
          [attr.aria-label]="'Toggle ' + node.name"
        >
          <mat-icon class="mat-icon-rtl-mirror">
            {{ treeControl.isExpanded(node) ? "remove" : "add" }}
          </mat-icon>
        </button>
        <a class="sideOption" (click)="returnFolderId(node.folder_id)">
          <mat-icon style="color: blue">{{
            treeControl.isExpanded(node) ? "folder_open" : "folder"
          }}</mat-icon
          >{{ node.name }}
        </a>
      </mat-tree-node>
    </mat-tree>
  </div>
</section>
