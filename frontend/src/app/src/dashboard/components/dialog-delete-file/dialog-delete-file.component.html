<div mat-dialog-content>
  <div
    class="header"
    style="
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    "
  >
    <p>Borrar archivo</p>
    <a (click)="onNoClick()" style="color: red">
      <mat-icon>highlight_off</mat-icon>
    </a>
  </div>
  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    "
  >
    <h2>¿Esta seguro de borrar el archivo {{ data.name }}?</h2>
    <button mat-flat-button color="accent" (click)="deleteFile()">SI</button>
  </div>
</div>
