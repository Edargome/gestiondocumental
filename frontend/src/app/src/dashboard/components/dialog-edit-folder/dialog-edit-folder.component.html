<div mat-dialog-content>
  <div class="header">
    <a (click)="onNoClick()">
      <mat-icon>highlight_off</mat-icon>
    </a>
  </div>
  <form [formGroup]="folderDisplay" class="formContent">
    <p class="title">Editar carpeta</p>
    <mat-form-field appearance="outline">
      <mat-label>Nombre carpeta</mat-label>
      <input type="text" matInput formControlName="folderNameControl" />
      <mat-error style="font-size: small"
        >El nombre de la carpeta es requerido</mat-error
      >
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea
        matInput
        placeholder="Descripción contenido carpeta"
        formControlName="folderDescControl"
      ></textarea>
    </mat-form-field>
    <button
      mat-stroked-button
      color="primary"
      [disabled]="folderDisplay.invalid"
      (click)="seveFolder()"
    >
      Guardar &nbsp;
      <mat-icon>save</mat-icon>
    </button>
  </form>
</div>
