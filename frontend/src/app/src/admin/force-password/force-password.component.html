<div class="content">
  <form [formGroup]="form" (ngSubmit)="save()">
    <img src="/assets/logo_gesdoc.png" alt="Instituto del tórax" width="320" />
    <p class="title">Debes cambiar tu contraseña para continuar</p>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña actual</mat-label>
      <input matInput formControlName="currentPassword" type="password" />
      <mat-icon matSuffix>password</mat-icon>
      <mat-error *ngIf="form.get('currentPassword')?.hasError('required')">
        La contraseña actual es requerida
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput formControlName="newPassword" type="password" />
      <mat-icon matSuffix>password</mat-icon>
      <mat-error *ngIf="form.get('newPassword')?.hasError('required')">
        La nueva contraseña es requerida
      </mat-error>
      <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">
        Mínimo 8 caracteres
      </mat-error>
    </mat-form-field>

    <button mat-fab extended color="primary" type="submit" [disabled]="form.invalid">
      Guardar
      <mat-icon>save</mat-icon>
    </button>

    <button mat-button type="button" (click)="logout()">Cerrar sesión</button>
  </form>
</div>
